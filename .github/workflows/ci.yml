name: CI & PR Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [uat]

jobs:
  verify:
    name: Lint, Test & Package Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Compile Extension (esbuild)
        run: npm run compile

      - name: Verify Packaging (.vsix dry-run)
        run: npx --yes @vscode/vsce package --no-git-tag-version --allow-missing-repository --out ./dist/devlogstudio-verify.vsix
